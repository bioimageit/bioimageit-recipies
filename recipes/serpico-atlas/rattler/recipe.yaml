context:
  name: atlas
  version: 1.0.3

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://gitlab.inria.fr/serpico/atlas/-/archive/v${{ version }}/atlas-v${{ version }}.zip
  sha256: e06b3623c87ba691842d002f4848607a31fad6c8c02213ef4cd6f4cf0019bca9
  patches:
    - patches/fix-cmake-portability.patch

build:
  number: 2
  skip:
    - target_platform != "linux-64" and target_platform != "osx-arm64"
  script:
    - if: unix
      then: |
        if [[ "$(uname)" == "Darwin" ]]; then
          zlib_library="$(ls "${PREFIX}"/lib/libz.dylib "${PREFIX}"/lib/libz.*.dylib 2>/dev/null | head -n 1)"
        else
          zlib_library="$(ls "${PREFIX}"/lib/libz.so "${PREFIX}"/lib/libz.so.* 2>/dev/null | head -n 1)"
        fi
        test -n "${zlib_library}"
        cmake -S . -B build ${CMAKE_ARGS} -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="${PREFIX}" \
          -DCMAKE_INSTALL_LIBDIR=lib \
          -DCMAKE_PREFIX_PATH="${PREFIX}" \
          -DCMAKE_INCLUDE_PATH="${PREFIX}/include" \
          -DCMAKE_LIBRARY_PATH="${PREFIX}/lib" \
          -DCMAKE_IGNORE_PREFIX_PATH="/opt/homebrew;/usr/local" \
          -DZLIB_ROOT="${PREFIX}" \
          -DZLIB_INCLUDE_DIR="${PREFIX}/include" \
          -DZLIB_LIBRARY="${zlib_library}" \
          -DENABLE_OPENMP=ON \
          -DUSE_DISPLAY_LIBS=OFF \
          -DUSE_JPEG_LIBS=OFF \
          -DUSE_PNG_LIBS=ON \
          -DUSE_TIFF_LIBS=ON
        cmake --build build --parallel ${CPU_COUNT}
        cmake --install build

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
  host:
    - gsl
    - libtiff
    - libpng
    - libzlib
    - if: linux
      then: libgomp
    - if: osx
      then: llvm-openmp
  run:
    - gsl
    - libtiff
    - libpng
    - libzlib
    - if: linux
      then: libgomp
    - if: osx
      then: llvm-openmp

tests:
  - script:
      - if: unix
        then: |
          test -x "${PREFIX}/bin/atlas"
          test -x "${PREFIX}/bin/blobsref"
          atlas --help > atlas-help.txt 2>&1
          grep -q "ATLAS is a spot detector" atlas-help.txt
          blobsref --help > blobsref-help.txt 2>&1
          grep -q "Count the number of blobs" blobsref-help.txt

about:
  homepage: https://gitlab.inria.fr/serpico/atlas
  summary: Spot detection in 2D images
  license: GPL-3.0-only
  license_file: LICENSE
